apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway-infra
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      hostname: "*.exampledomain.example"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
